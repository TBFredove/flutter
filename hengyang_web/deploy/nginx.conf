server {
    listen 80;
    server_name iot.hengyanghk.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://iot.hengyanghk.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name iot.hengyanghk.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
    ssl_certificate /etc/letsencrypt/live/iot.hengyanghk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot.hengyanghk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    root /usr/share/nginx/html;

    location /api/v1/ {
        set $backend http://hengyang-backend:8000;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
    }

    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
